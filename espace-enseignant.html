<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Enseignant — Cours de Philosophie</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', 'Roboto', sans-serif}
        :root{
            --primaire:#1a56db;
            --primaire-clair:#e8f0fe;
            --primaire-fonce:#0f3fa8;
            --succes:#0e9f6e;
            --succes-clair:#f0fdf4;
            --attention:#d97706;
            --attention-clair:#fffbeb;
            --erreur:#dc2626;
            --erreur-clair:#fef2f2;
            --gris-50:#f9fafb;
            --gris-100:#f3f4f6;
            --gris-200:#e5e7eb;
            --gris-600:#4b5563;
            --gris-700:#374151;
            --ombre-souple:0 10px 25px -5px rgba(26, 86, 219, 0.08), 0 8px 10px -6px rgba(26, 86, 219, 0.05);
            --ombre-legere:0 2px 8px rgba(0,0,0,0.04);
        }
        body{background:linear-gradient(135deg,#f0f4fa 0%,#e6eef9 100%);min-height:100vh;color:var(--gris-700);line-height:1.6}
        header{background:linear-gradient(135deg,#1a56db 0%,#2563eb 100%);color:white;padding:2rem 1rem 3rem;border-radius:0 0 2.5rem 2.5rem;box-shadow:var(--ombre-souple)}
        .header-contenu{max-width:800px;margin:0 auto}
        .fil-ariane{margin-bottom:1rem}
        .lien-retour{color:rgba(255,255,255,0.9);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;font-weight:500;transition:transform .2s}
        .lien-retour:hover{transform:translateX(-3px)}
        h1{font-size:1.8rem;margin-bottom:.5rem}
        .sous-titre{opacity:.95;font-weight:300;margin-bottom:1.5rem}
        .identifiant{display:flex;align-items:center;gap:.8rem;background:rgba(255,255,255,.18);padding:.6rem 1rem;border-radius:50px;margin-top:-3.5rem;justify-content:flex-end}
        .deco{background:rgba(255,255,255,.25);color:white;border:none;padding:.4rem .9rem;border-radius:50px;cursor:pointer;font-weight:600;transition:all .2s}
        .deco:hover{background:rgba(255,255,255,.4)}
        .container{max-width:800px;margin:-1rem auto 3rem;padding:0 1rem}
        .onglets{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .onglet{padding:.85rem 1.4rem;background:white;border:none;border-radius:.9rem;cursor:pointer;font-weight:600;transition:all .3s;color:var(--gris-600);box-shadow:var(--ombre-legere)}
        .onglet:hover{transform:translateY(-2px)}
        .onglet.actif{background:linear-gradient(135deg,var(--primaire),var(--primaire-fonce));color:white;box-shadow:0 4px 12px rgba(26,86,219,0.2)}
        .contenu-onglet{display:none;animation:fadeIn .4s ease forwards}
        .contenu-onglet.visible{display:block}
        .carte{background:white;border-radius:1.25rem;box-shadow:var(--ombre-legere);padding:2rem;margin-bottom:1.25rem}
        h2{color:var(--primaire);margin-bottom:1.5rem;font-size:1.35rem}
        .form-groupe{margin-bottom:1.3rem}
        label{display:block;font-weight:600;margin-bottom:.6rem;color:var(--gris-700)}
        input[type="text"],input[type="date"],input[type="password"],textarea{width:100%;padding:.9rem 1rem;border:2px solid var(--gris-200);border-radius:.9rem;font-size:1rem;transition:border-color .2s}
        input:focus,textarea:focus{outline:none;border-color:var(--primaire);box-shadow:0 0 0 4px rgba(26,86,219,0.1)}
        textarea{min-height:140px;resize:vertical}
        .bouton{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem 1.8rem;border-radius:.9rem;font-weight:700;border:none;cursor:pointer;font-size:1rem;transition:all .3s}
        .bouton.primaire{background:linear-gradient(135deg,var(--primaire),var(--primaire-fonce));color:white;box-shadow:0 4px 12px rgba(26,86,219,0.2)}
        .bouton.primaire:hover{transform:translateY(-2px)}
        .bouton.rouge{background:linear-gradient(135deg,var(--erreur),#b91c1c);color:white}
        .bouton.rouge:hover{transform:translateY(-2px)}
        table{width:100%;border-collapse:separate;border-spacing:0;margin-top:1rem;border-radius:.9rem;overflow:hidden}
        th,td{padding:1rem;text-align:left;border-bottom:1px solid var(--gris-100)}
        th{background:var(--gris-50);font-weight:700}
        tr:last-child td{border-bottom:none}
        tr:hover td{background:var(--gris-50)}
        .badge{padding:.35rem .9rem;border-radius:50px;font-size:.8rem;font-weight:700}
        .badge.rendu{background:var(--succes-clair);color:var(--succes)}
        .badge.attente{background:var(--attention-clair);color:var(--attention)}
        .ligne-journal{padding:1rem 0;border-bottom:1px solid var(--gris-100)}
        .ligne-journal:hover{background:var(--gris-50)}
        .date-journal{font-size:.85rem;color:var(--gris-600);margin-top:.3rem}
        .masque{display:none}
        .message{padding:1rem 1.25rem;border-radius:.9rem;margin:1rem 0;font-weight:500}
        .message.succes{background:var(--succes-clair);border-left:4px solid var(--succes);color:#065f46}
        .message.erreur{background:var(--erreur-clair);border-left:4px solid var(--erreur);color:#991b1b}
        .vide{text-align:center;padding:3rem 2rem;color:var(--gris-600)}
        footer{text-align:center;padding:2rem 1rem;color:var(--gris-600);font-size:.9rem}
        @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>

<header>
    <div class="header-contenu">
        <div class="fil-ariane">
            <a href="agenda.html" class="lien-retour">← Retour à l'accueil</a>
        </div>
        <h1>👨‍🏫 Espace Enseignant</h1>
        <p class="sous-titre">Gérez les devoirs et suivez les rendus des élèves</p>
        <div class="identifiant" id="zoneIdentifiant"></div>
    </div>
</header>

<div class="container" id="contenuPrincipal">
    <p style="text-align:center;color:var(--gris-600);padding:2rem">Chargement en cours...</p>
</div>

<footer>
    <p>© 2026 — Cours de Philosophie · Mananjary · Madagascar</p>
</footer>

<script>
const ENSEIGNANT = { login:'prof', mdp:'prof123', nom:'Enseignant' };
const ADMIN = { login:'admin', mdp:'451748', nom:'Administrateur' };
const cleJournal = 'journalActivites';

const utilisateurActuel = sessionStorage.getItem('enseignantConnecte');
const zoneIdentifiant = document.getElementById('zoneIdentifiant');
const conteneur = document.getElementById('contenuPrincipal');

if (!utilisateurActuel) {
    conteneur.innerHTML = `
        <div class="carte" style="max-width:460px;margin:2rem auto">
            <h2 style="text-align:center">🔐 Connexion</h2>
            <div id="msgErreur" class="message erreur masque">Identifiant ou mot de passe incorrect</div>
            <form id="formConnexion">
                <div class="form-groupe">
                    <label>Identifiant</label>
                    <input type="text" id="login" required placeholder="prof / admin">
                </div>
                <div class="form-groupe">
                    <label>Mot de passe</label>
                    <input type="password" id="mdp" required placeholder="votre mot de passe">
                </div>
                <button type="submit" class="bouton primaire" style="width:100%">Se connecter</button>
            </form>
        </div>
    `;
    document.getElementById('formConnexion').addEventListener('submit', e => {
        e.preventDefault();
        const l = document.getElementById('login').value.trim();
        const m = document.getElementById('mdp').value.trim();
        if ((l === ENSEIGNANT.login && m === ENSEIGNANT.mdp) || 
            (l === ADMIN.login && m === ADMIN.mdp)) {
            sessionStorage.setItem('enseignantConnecte', l);
            chargerInterface();
        } else {
            document.getElementById('msgErreur').classList.remove('masque');
        }
    });
} else {
    chargerInterface();
}

function chargerInterface() {
    const estAdmin = sessionStorage.getItem('enseignantConnecte') === 'admin';
    zoneIdentifiant.innerHTML = `
        <span>${estAdmin ? '🔧 Administrateur' : '👨‍🏫 Enseignant'}</span>
        <button class="deco" id="deco">Déconnexion</button>
    `;
    document.getElementById('deco').addEventListener('click', () => {
        sessionStorage.removeItem('enseignantConnecte');
        location.reload();
    });

    conteneur.innerHTML = `
        <div class="onglets">
            <button class="onglet actif" data-onglet="ajouter">➕ Ajouter un devoir</button>
            <button class="onglet" data-onglet="suivi">📋 Suivi des rendus</button>
            <button class="onglet" data-onglet="journal">📖 Journal des activités</button>
        </div>

        <div class="contenu-onglet visible" id="ajouter">
            <div class="carte">
                <h2>📝 Créer un nouveau devoir</h2>
                <form id="formAjoutDevoir">
                    <div class="form-groupe">
                        <label>Titre du devoir *</label>
                        <input type="text" id="titreDevoir" required placeholder="Ex: La Liberté — Dissertation">
                    </div>
                    <div class="form-groupe">
                        <label>Consigne / Sujet *</label>
                        <textarea id="consigneDevoir" required placeholder="Sujet, instructions..."></textarea>
                    </div>
                    <div class="form-groupe">
                        <label>Date limite *</label>
                        <input type="date" id="dateLimiteDevoir" required>
                    </div>
                    <button type="submit" class="bouton primaire">✅ Enregistrer</button>
                    <div id="msgAjout" class="message succes masque" style="margin-top:1.5rem">✅ Devoir ajouté avec succès !</div>
                </form>
            </div>
        </div>

        <div class="contenu-onglet" id="suivi">
            <div class="carte">
                <h2>📊 Suivi des rendus élèves</h2>
                <div id="tableauSuivi"></div>
            </div>
        </div>

        <div class="contenu-onglet" id="journal">
            <div class="carte">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
                    <h2 style="margin:0">📖 Historique des activités</h2>
                    ${estAdmin ? `<button id="viderJournal" class="bouton rouge" style="font-size:.85rem;padding:.6rem 1.2rem">🗑️ Vider</button>` : ''}
                </div>
                <div id="listeJournal"></div>
            </div>
        </div>
    `;

    document.querySelectorAll('.onglet').forEach(onglet => {
        onglet.addEventListener('click', () => {
            document.querySelectorAll('.onglet').forEach(o => o.classList.remove('actif'));
            onglet.classList.add('actif');
            const id = onglet.dataset.onglet;
            document.querySelectorAll('.contenu-onglet').forEach(c => c.classList.remove('visible'));
            document.getElementById(id).classList.add('visible');
            if (id === 'suivi') afficherSuivi();
            if (id === 'journal') afficherJournal();
        });
    });

    document.getElementById('formAjoutDevoir').addEventListener('submit', e => {
        e.preventDefault();
        const titre = document.getElementById('titreDevoir').value.trim();
        const consigne = document.getElementById('consigneDevoir').value.trim();
        const dateLimite = document.getElementById('dateLimiteDevoir').value;

        const listeDevoirs = JSON.parse(localStorage.getItem('devoirs') || '[]');
        const nouveau = {
            id: listeDevoirs.length ? Math.max(...listeDevoirs.map(d => d.id)) + 1 : 1,
            titre, consigne, dateLimite
        };
        listeDevoirs.push(nouveau);
        localStorage.setItem('devoirs', JSON.stringify(listeDevoirs));

        ajouterJournal(`Devoir créé : « ${titre} »`);

        document.getElementById('formAjoutDevoir').reset();
        const msg = document.getElementById('msgAjout');
        msg.classList.remove('masque');
        setTimeout(() => msg.classList.add('masque'), 3000);
    });

    if (estAdmin) {
        document.getElementById('viderJournal')?.addEventListener('click', () => {
            if (confirm('Effacer tout le journal ?')) {
                localStorage.setItem(cleJournal, '[]');
                ajouterJournal('Journal vidé par administrateur');
                afficherJournal();
            }
        });
    }

    afficherSuivi();
    afficherJournal();
}

function ajouterJournal(texte) {
    const journal = JSON.parse(localStorage.getItem(cleJournal) || '[]');
    journal.unshift({ date: new Date().toLocaleString('fr-FR'), action: texte });
    localStorage.setItem(cleJournal, JSON.stringify(journal));
}

function afficherSuivi() {
    const listeDevoirs = JSON.parse(localStorage.getItem('devoirs') || '[]');
    const tousRendus = [];
    for (let i = 0; i < localStorage.length; i++) {
        const cle = localStorage.key(i);
        if (cle.startsWith('rendus_')) {
            const rendus = JSON.parse(localStorage.getItem(cle) || '[]');
            const loginEleve = cle.replace('rendus_', '');
            rendus.forEach(r => {
                if (!tousRendus.some(t => t.idDevoir === r.idDevoir && t.loginEleve === loginEleve)) {
                    tousRendus.push({ ...r, loginEleve });
                }
            });
        }
    }

    let html = '<table><thead><tr><th>Devoir</th><th>Élève</th><th>Titre du travail</th><th>Mode</th><th>Date dépôt</th><th>Statut</th></tr></thead><tbody>';
    
    if (listeDevoirs.length === 0) {
        html += '<tr><td colspan="6" class="vide">Aucun devoir créé pour l\'instant</td></tr>';
    } else {
        listeDevoirs.forEach(devoir => {
            const rendusDevoir = tousRendus.filter(r => r.idDevoir === devoir.id);
            if (rendusDevoir.length === 0) {
                html += `
                    <tr>
                        <td><strong>${devoir.titre}</strong></td>
                        <td colspan="3" style="color:var(--gris-600)">Aucun rendu</td>
                        <td>-</td>
                        <td><span class="badge attente">En attente</span></td>
                    </tr>
                `;
            } else {
                rendusDevoir.forEach(r => {
                    html += `
                        <tr>
                            <td>${devoir.titre}</td>
                            <td>${r.loginEleve}</td>
                            <td>${r.nomTravail || '-'}</td>
                            <td>${r.type === 'texte' ? 'Texte' : 'Fichier'}</td>
                            <td>${r.date
