<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda — Cours de Philosophie</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        :root{--bleu-fonce:#0D47A1;--bleu:#1565C0;--vert:#2E7D32;--orange:#E65100;--rouge:#D32F2F;--gris:#666;--fond:#FAFAFA;--texte:#333;--bordure:#E0E0E0}
        body{background:var(--fond);color:var(--texte);line-height:1.6}
        header{background:linear-gradient(135deg,#0D47A1,#1565C0);color:white;padding:1.5rem 1rem}
        .header-contenu{max-width:700px;margin:0 auto}
        .utilisateur{text-align:right;margin-top:-2.5rem;font-size:.9rem}
        .deco{color:white;background:none;border:none;cursor:pointer;text-decoration:underline;margin-left:.5rem}
        .container{max-width:700px;margin:0 auto;padding:2rem 1rem}
        h2{color:var(--bleu);margin-bottom:1.5rem}
        .carte{background:white;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08);padding:1.5rem;margin-bottom:1.2rem;transition:.2s}
        .carte:hover{transform:translateY(-2px)}
        .carte.travail{border-left:4px solid var(--bleu)}
        .carte.fait{border-left:4px solid var(--vert);opacity:.85}
        .carte.en-retard{border-left:4px solid var(--rouge)}
        .haut-carte{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem}
        .titre-tache{font-weight:bold;font-size:1.1rem}
        .statut{font-size:.8rem;padding:.25rem .6rem;border-radius:20px;font-weight:bold}
        .statut.en-cours{background:#E3F2FD;color:var(--bleu)}
        .statut.fait{background:#E8F5E9;color:var(--vert)}
        .statut.en-retard{background:#FFEBEE;color:var(--rouge)}
        .consigne{color:#555;margin:.8rem 0;white-space:pre-line}
        .date-limite{font-size:.9rem;color:var(--gris)}
        .temps-restant{font-weight:bold;margin-top:.3rem}
        .temps-restant.vert{color:var(--vert)}
        .temps-restant.orange{color:var(--orange)}
        .temps-restant.rouge{color:var(--rouge)}
        .bouton-deposer{display:inline-block;margin-top:1rem;padding:.6rem 1.2rem;background:var(--bleu);color:white;border-radius:8px;text-decoration:none;font-weight:bold;transition:.2s}
        .bouton-deposer:hover{background:#0D47A1}
        .bouton-desactive{background:#ccc;cursor:not-allowed;pointer-events:none}
        .message-vide{text-align:center;padding:3rem 1rem;color:var(--gris)}
        footer{background:#222;color:#aaa;text-align:center;padding:2rem 1rem;margin-top:3rem;font-size:.9rem}
    </style>
</head>
<body>

<header>
    <div class="header-contenu">
        <h1>📅 Agenda des devoirs</h1>
        <div class="utilisateur" id="zoneUtilisateur"></div>
    </div>
</header>

<div class="container" id="listeDevoirs">
    <p>Chargement...</p>
</div>

<footer>
    <p>© 2026 — Cours de Philosophie. Mananjary — Madagascar</p>
    <p>📧 rnj2618@gmail.com | 📱 +261 38 552 8349</p>
</footer>

<script>
const eleve = JSON.parse(sessionStorage.getItem('eleveConnecte'));
const conteneur = document.getElementById('listeDevoirs');
const zoneUtilisateur = document.getElementById('zoneUtilisateur');

if (!eleve) {
    zoneUtilisateur.innerHTML = `<a href="connexion.html" style="color:white">Se connecter</a>`;
    conteneur.innerHTML = `
        <div class="carte">
            <p style="text-align:center;padding:1rem">Veuillez <a href="connexion.html" style="color:var(--bleu);font-weight:bold">vous connecter</a> pour voir vos devoirs.</p>
        </div>
    `;
} else {
    zoneUtilisateur.innerHTML = `
        ${eleve.prenom} ${eleve.nom}
        <button class="deco" id="btnDeconnexion">Déconnexion</button>
    `;
    document.getElementById('btnDeconnexion').addEventListener('click', () => {
        sessionStorage.removeItem('eleveConnecte');
        location.reload();
    });

    const listeDevoirs = JSON.parse(localStorage.getItem('devoirs') || JSON.stringify([
        {id:1, titre:"La Vérité — Dissertation", consigne:"Sujet : « Est-ce que la vérité existe ? »\nDéveloppez une argumentation structurée en 3 parties.", dateLimite:"2026-09-11"},
        {id:2, titre:"La Liberté — Question de texte", consigne:"Commentaire du texte de Sartre : « L'existence précède l'essence ».", dateLimite:"2026-09-18"},
        {id:3, titre:"Le Devoir — Exercice", consigne:"Définissez le devoir selon Kant et expliquez pourquoi il est « pur ».", dateLimite:"2026-09-04"}
    ]));

    const cleRendus = 'rendus_' + eleve.login;
    const rendus = JSON.parse(localStorage.getItem(cleRendus) || '[]');

    function calculerTemps(dateLimiteStr) {
        const maintenant = new Date();
        const limite = new Date(dateLimiteStr);
        const diff = limite - maintenant;
        if (diff < 0) return { valeur:-1, texte:"Délai dépassé", classe:"rouge" };
        const jours = Math.floor(diff/(1000*60*60*24));
        const heures = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        let texte = jours>0 ? jours + " jour" + (jours>1?"s":"") : "";
        if (heures>0) texte += (texte?" ":"") + heures + " heure" + (heures>1?"s":"");
        return { valeur:diff, texte:texte||"Moins d'une heure", classe:jours<=1?"orange":"vert" };
    }

    let html = "";
    if (listeDevoirs.length === 0) {
        html = `<p class="message-vide">Aucun devoir prévu pour l'instant 🎉</p>`;
    } else {
        listeDevoirs.forEach(devoir => {
            const temps = calculerTemps(devoir.dateLimite);
            const dateAffichage = new Date(devoir.dateLimite).toLocaleDateString('fr-FR');
            const rendu = rendus.find(r => r.idDevoir === devoir.id);

            let classeCarte = "travail";
            let statutTexte = "À rendre";
            let statutClasse = "en-cours";
            let bouton = `<a href="depot-devoir.html?id=${devoir.id}" class="bouton-deposer">📤 Déposer mon travail</a>`;

            if (rendu) {
                classeCarte = "fait";
                statutTexte = "✅ Rendu";
                statutClasse = "fait";
                bouton = `<span class="bouton-deposer bouton-desactive">Déjà déposé le ${rendu.dateRendu}</span>`;
            } else if (temps.valeur < 0) {
                classeCarte = "en-retard";
                statutTexte = "⏱️ En retard";
                statutClasse = "en-retard";
                bouton = `<span class="bouton-deposer bouton-desactive">Délai dépassé</span>`;
            }

            html += `
                <div class="carte ${classeCarte}">
                    <div class="haut-carte">
                        <h3 class="titre-tache">${devoir.titre}</h3>
                        <span class="statut ${statutClasse}">${statutTexte}</span>
                    </div>
                    <p class="consigne">${devoir.consigne}</p>
                    <p class="date-limite">📅 Date limite : ${dateAffichage}</p>
                    <p class="temps-restant ${temps.classe}">⏱️ Temps restant : ${temps.texte}</p>
                    ${bouton}
                </div>
            `;
        });
    }
    conteneur.innerHTML = html;
}
</script>

</body>
</html>
